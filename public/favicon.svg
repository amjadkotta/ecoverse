<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favLeaf" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#1B6A45" />
      <stop offset="45%" stop-color="#39B86B" />
      <stop offset="100%" stop-color="#B8F34A" />
    </linearGradient>
    <linearGradient id="favOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F34A" />
      <stop offset="60%" stop-color="#39B86B" />
      <stop offset="100%" stop-color="#155D3A" />
    </linearGradient>
    <radialGradient id="favGlobe" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0F442E" />
      <stop offset="70%" stop-color="#08291C" />
      <stop offset="100%" stop-color="#041A12" />
    </radialGradient>
  </defs>

  <!-- Deep Forest Squircle Base for Universal Tab Contrast across Light & Dark OS themes -->
  <rect width="100" height="100" rx="22" fill="#041A12" />
  <rect width="96" height="96" x="2" y="2" rx="20" stroke="#39B86B" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Orbital Ring: Back Arc (tucked behind the planet) -->
  <path
    d="M 20,38 C 28,22 62,16 80,30"
    stroke="url(#favOrbit)"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Planet Sphere Core (Deep Emerald Biosphere) -->
  <circle
    cx="50"
    cy="50"
    r="27"
    fill="url(#favGlobe)"
    stroke="#39B86B"
    stroke-width="1.5"
    stroke-opacity="0.4"
  />

  <!-- Primary Botanical Leaf (Left Hemisphere to Apex Sprout) -->
  <path
    d="M 50,17 
       C 36.5,26.5 23,37 23,50 
       C 23,64.9 35.1,77 50,77 
       C 41,67 37.5,54.5 41.5,43 
       C 44,34 47,24.5 50,17 Z"
    fill="url(#favLeaf)"
  />

  <!-- Secondary Growth Crescent (Right Hemisphere) -->
  <path
    d="M 50,25 
       C 55.5,33.5 56.5,43.5 53.5,53.5 
       C 51,63.5 54,69.5 61,73.5 
       C 70,68.5 77,59.8 77,50 
       C 77,37 65.5,25 50,25 Z"
    fill="#39B86B"
    fill-opacity="0.85"
  />

  <!-- Central Growth Sprout Stem (Neon-Lime Trajectory) -->
  <path
    d="M 50,75 Q 46.5,48 50,19"
    stroke="#B8F34A"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Orbital Ring: Front Arc (swooping across front of sphere) -->
  <path
    d="M 80,30 C 94,46 86,72 60,80 C 38,88 16,74 20,52"
    stroke="url(#favOrbit)"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- Orbital Satellite Node / Clean Energy Beacon -->
  <circle cx="80" cy="30" r="4.5" fill="#B8F34A" />
  <circle cx="80" cy="30" r="1.8" fill="#041A12" />
</svg>
